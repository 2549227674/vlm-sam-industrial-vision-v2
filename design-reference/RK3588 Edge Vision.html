<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RK3588 Edge Vision · Digital Twin + Profiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* NVIDIA-inspired near-black surfaces, hairline borders */
  --bg:        #050507;
  --bg-1:      #0b0b0f;
  --bg-2:      #111116;
  --bg-3:      #181820;
  --bg-4:      #20202b;
  --line:      rgba(255,255,255,0.08);
  --line-soft: rgba(255,255,255,0.05);
  --line-hot:  rgba(255,255,255,0.18);
  --fg:        #f4f7fb;
  --fg-1:      #c8c8d2;
  --fg-2:      #84848e;
  --fg-3:      #5a5a64;
  --fg-4:      #38383f;

  /* single bold accent (user-chosen, default electric lime) */
  --acc:       #c1ff72;
  --acc-glow:  rgba(193,255,114,0.22);

  /* stage colors (per NPU core) */
  --core-0:    #7cdcff;  /* EfficientAD */
  --core-1:    #ffbf5c;  /* FastSAM */
  --core-2:    #ff7a90;  /* Qwen3-VL */

  --ok:        #6dffac;
  --warn:      #ffbf5c;
  --crit:      #ff6378;

  --font-sans: "Geist", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 14px;
  letter-spacing: -0.005em;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
  min-height: 100vh;
}

body{
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(193,255,114,0.025) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(124,220,255,0.018) 0%, transparent 70%),
    var(--bg);
  background-attachment: fixed;
}

button{ font-family: inherit; color: inherit; cursor: pointer; }

::selection{ background: var(--acc); color: var(--bg); }

::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-track{ background: var(--bg); }
::-webkit-scrollbar-thumb{ background: var(--bg-3); border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background: var(--line-hot); }

.mono{ font-family: var(--font-mono); font-feature-settings: "zero", "ss02"; font-variant-numeric: tabular-nums; }

.eyebrow{
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 500;
  color: var(--fg-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  display: inline-block;
}

@keyframes pulse-dot{ 0%,100%{ opacity: 1; transform: scale(1); } 50%{ opacity: 0.4; transform: scale(0.7); } }
@keyframes core-glow{
  0%, 100% { filter: drop-shadow(0 0 8px currentColor); opacity: 0.95; }
  50%      { filter: drop-shadow(0 0 18px currentColor); opacity: 1; }
}
@keyframes packet-flow{
  0%   { offset-distance: 0%;   opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes blink-cursor{ 0%,49%{ opacity: 1; } 50%,100%{ opacity: 0; } }
@keyframes slide-in-up{
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes scan-line{
  0%   { transform: translateY(-100%); }
  100% { transform: translateY(900%); }
}
@keyframes ring-expand{
  0%   { transform: scale(0.4); opacity: 0.6; }
  100% { transform: scale(2.2); opacity: 0; }
}
@keyframes log-in{
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: translateY(0); }
}

#root{ min-height: 100vh; }

.hairline{ background: var(--line); height: 1px; }
</style>
</head>
<body>
  <div id="root"></div>

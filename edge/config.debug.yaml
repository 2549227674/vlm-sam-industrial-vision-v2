# ── edge/config.debug.yaml ─────────────────────────────────────
# 仅调试配置，用于 Prompt 2C 集成测试。
#
# 用途：
#   - 验证 T3 FastSAM / Qwen3-VL / T4 upload 链路端到端。
#   - 绕过 T2 阈值门控，所有帧进入 Q2 → T3 → T4。
#   - 不代表正式产线节拍。
#   - 不是默认部署配置。
#   - pass_all 仅用于调试和集成测试，不是正式生产模式。
#
# 使用方式：
#   ./edge_pipeline edge/config.debug.yaml
#
# 适用场景：
#   - Prompt 2C 集成调试（真实 FastSAM + Qwen3-VL）。
#   - 验证 T4 upload 流水线。
#   - 未知阈值类别的临时回退。
#
# 不适用场景：
#   - 正式部署（使用 config.yaml）。
#   - 性能基准测试（pass_all 会导致 T3/T4 过载）。

# ── 设备标识 ──────────────────────────────────────
device_id: rk3588-line-A-cam01
line_id: "L1"

# ── 后端连接 ──────────────────────────────────────
backend_url: http://192.168.1.100:8000
upload_timeout_s: 30
upload_max_retries: 5

# ── AB 测试 ───────────────────────────────────────
vlm_variant: "base"
vlm_model_size: "4B"

# ── 取帧模式 ──────────────────────────────────────
capture_mode: image_loop

# V4L2 模式
camera_device: /dev/video0
camera_width: 1920
camera_height: 1080

# Image Loop 模式
# NOTE: Reduce categories for faster debug cycles if needed.
image_loop_dir: /home/orangepi/vlm-sam-industrial-vision-v2/simulator/mvtec
image_loop_categories:
  - bottle
  - cable
  - capsule
  - carpet
  - grid
  - hazelnut
  - leather
  - metal_nut
  - pill
  - screw
  - tile
  - toothbrush
  - transistor
  - wood
  - zipper
image_loop_beat_ms: 1500
image_loop_jitter_ms: 200

# ── Stage 1：EfficientAD-S ───────────────────────
efficientad_model_dir: /home/orangepi/models/efficientad_models
efficientad_threshold: 0.5
efficientad_input_size: 256

# ── Stage 1：调试门控配置 ────────────────────────
# pass_all：所有帧不论分数均进入 Q2。
# 日志会明确显示 gate_mode=pass_all。
# 仅用于调试和 Prompt 2C 集成测试，不代表正式生产模式。
efficientad_threshold_default: 0.50
efficientad_score_mode: map_mean
efficientad_gate_mode: pass_all
per_category_threshold:
  capsule: 0.30
  screw: 0.35

# ── Stage 2：FastSAM ──────────────────────────────
fastsam_model_path: /home/orangepi/models/fastsam_models/fastsam_s.rknn
fastsam_input_size: 640
fastsam_conf: 0.5

# ── Stage 3：Qwen3-VL-2B/4B ──────────────────────
vlm_model_path: /home/orangepi/models/qwen3vl_models/qwen3vl_2b_w8a8_base.rkllm
vlm_vision_model_path: /home/orangepi/models/qwen3vl_models/qwen3vl_2b_vision.rknn
vlm_4b_model_path: /home/orangepi/models/qwen3vl_models/qwen3vl_4b_w8a8_base.rkllm
vlm_4b_vision_model_path: /home/orangepi/models/qwen3vl_models/qwen3vl_4b_vision.rknn
vlm_2b_lora_model_path: /home/orangepi/models/qwen3vl_models/qwen3vl_2b_w8a8_lora_15cls.rkllm
vlm_4b_lora_model_path: /home/orangepi/models/qwen3vl_models/qwen3vl_4b_w8a8_lora_15cls.rkllm
vlm_max_new_tokens: 200
vlm_max_context: 4096
vlm_npu_core_num: 3

# ── 图片落盘 ──────────────────────────────────────
jpeg_quality: 85

# Phase 10 v1 — YOLOv8n-detect training config for metal_nut + cable.
#
# Usage:
#   yolo detect train data=configs/phase10_yolov8n.yaml model=yolov8n.pt
#
# Reference: docs/experiments/phase10_v1_execution_plan.md §2.2

# Model
model: yolov8n.pt

# Data (path to dataset YAML generated by split_mvtec_localization.py)
data: datasets/phase10/phase10.yaml

# Training hyperparameters
imgsz: 640
epochs: 100
batch: 16
seed: 42
patience: 20

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.3
shear: 2.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Output
project: runs/phase10
name: yolov8n_metal_nut_cable

# Device (override with 'device=0' for GPU, 'device=cpu' for CPU)
device: ''

# Workers (override per machine)
workers: 4

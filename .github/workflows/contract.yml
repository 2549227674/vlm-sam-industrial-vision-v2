name: Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install jsonschema

      - name: Backend contract tests
        run: PYTHONPATH=. pytest backend/tests/contract/ -v --tb=short 2>&1

      - name: Contract schema drift check
        run: python scripts/check_contract_drift.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

  contract-validate-fixtures:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install jsonschema

      - name: Validate contract fixtures
        run: |
          for f in backend/tests/contract/fixtures/edge_report_valid_*.json; do
            echo "Validating $f ..."
            python scripts/validate_contract.py "$f"
          done
